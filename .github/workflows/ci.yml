name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Check generated modules are committed
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard dist)"
      # The published archive never ships devDependencies, so the gate audits the shipped
      # dependency surface. The release toolchain pulls in micromatch -> braces, which has an
      # open high advisory (GHSA-vfj7-8cjw-p6xm) with no published fix.
      - run: npm audit --omit=dev
