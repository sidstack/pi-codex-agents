name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Check generated modules are committed
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard dist)"
      # Full dependency audit (production and dev tree) with documented exceptions in
      # audit-ci.json: dev-only release-toolchain advisories with no obtainable fix, braces
      # GHSA-vfj7-8cjw-p6xm and the npm-bundled ip-address GHSA-rxp7-6hxx-x8q5, each expiring
      # 2026-11-20. Any other finding at moderate or above fails. See docs/RELEASING.md.
      - run: npm run audit:ci
