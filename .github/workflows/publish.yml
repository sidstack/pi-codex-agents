name: Publish approved release
on:
  push:
    branches: ['main', 'feat/**', 'fix/**', 'chore/**']
  workflow_dispatch:
# The workflow filter stays broad on purpose: a branch outside the supported `type/name`
# naming (see docs/RELEASING.md) still starts a run, but semantic-release finds no matching
# release branch and exits 0 without publishing anything.
# semantic-release creates the release commit and the vVERSION tag with GITHUB_TOKEN.
# GitHub does not start workflow runs for events caused by GITHUB_TOKEN, so tag pushes and
# release commits cannot re-trigger this workflow; there is no tag trigger at all.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    name: Gate the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - name: Check generated modules
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard dist)"
      # Full dependency audit (production and dev tree) with documented exceptions in
      # audit-ci.json: dev-only release-toolchain advisories with no obtainable fix, braces
      # GHSA-vfj7-8cjw-p6xm and the npm-bundled ip-address GHSA-rxp7-6hxx-x8q5, each expiring
      # 2026-11-20. Any other finding at moderate or above fails. See docs/RELEASING.md.
      - run: npm run audit:ci
  release:
    name: Release and publish
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: semantic-release
        # Versions package.json and package-lock.json, writes CHANGELOG.md, rebuilds dist,
        # commits and tags them, publishes to npm with trusted publishing and provenance,
        # then opens the GitHub release. npm dist-tag comes from the branch channel:
        # main publishes to latest, a prerelease branch to beta-BRANCHNAME.
        run: npx --no-install semantic-release
        env:
          # The variable name is significant: semantic-release turns this credential into
          # `x-access-token:<token>` for git pushes only when it is named GITHUB_TOKEN in a
          # GitHub Actions run. GH_TOKEN is used verbatim as the git username and GitHub
          # rejects it, failing the push with EGITNOPERMISSION. @semantic-release/github
          # accepts either name, so GITHUB_TOKEN alone covers git and the GitHub release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The identical release:check gate already ran in the check job on this commit, so
          # the publish lifecycle asserts release identity instead of rebuilding everything.
          PI_AUTOMATED_PUBLISH: 'true'
